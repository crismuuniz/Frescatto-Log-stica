<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema Logística</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #444;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        /* Grid de Links de Navegação */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .menu-item {
            text-decoration: none;
            color: #333;
            font-size: 18px;
            font-weight: bold;
            background: #f8f9fa;
            padding: 20px 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }

        .menu-item:hover {
            background: #007bff;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,123,255,0.2);
        }

        /* Inputs e Filtros */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input[type="date"] {
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        /* Botões de Relatório */
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            cursor: pointer;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-pdf {
            background: #e04f3a; /* Vermelho/Laranja PDF */
        }

        .btn-excel {
            background: #1e7e34; /* Verde Excel */
        }

        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 25px 0 15px 0;
        }

        code {
            background: #f1f1f1;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #c7254e;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>🚚 Sistema de Logística</h1>

    <div class="card">
        <h3>Módulos do Sistema</h3>
        <div class="menu-grid">
            <a href="/canhotos" class="menu-item">📄 Canhotos</a>
            <a href="/roteiros" class="menu-item">🛣️ Roteiros</a>
            <a href="/devolucoes" class="menu-item">↩️ Devoluções</a>
            <a href="/fretes" class="menu-item">💰 Fretes</a>
        </div>
    </div>

    <div class="card">
        <h3>📊 Exportar Relatórios por Período</h3>

        <div class="form-group">
            <label for="inicio">Data Inicial:</label>
            <input type="date" id="inicio">
        </div>

        <div class="form-group">
            <label for="fim">Data Final:</label>
            <input type="date" id="fim">
        </div>

        <div class="btn-group">
            <button onclick="gerarPDF()" class="btn-pdf">📄 Gerar PDF</button>
            <button onclick="gerarExcel()" class="btn-excel">📊 Gerar Excel</button>
        </div>

        <hr>

        <p style="color:#666; font-size:14px;"><b>Exemplo de endpoints manuais de consulta:</b></p>
        <code>/relatorio/intervalo/pdf?inicio=2026-06-01&fim=2026-06-30</code><br>
        <code>/relatorio/intervalo/excel?inicio=2026-06-01&fim=2026-06-30</code>
    </div>

</div>

<script>
    // Executa assim que a página carrega para preencher o mês atual automaticamente
    window.addEventListener("DOMContentLoaded", () => {
        const hoje = new Date();
        
        // Formata o ano e mês atuais
        const ano = hoje.getFullYear();
        const mes = String(hoje.getMonth() + 1).padStart(2, '0');
        const dia = String(hoje.getDate()).padStart(2, '0');

        // Primeiro dia do mês atual: AAAA-MM-01
        document.getElementById("inicio").value = `${ano}-${mes}-01`;
        // Dia de hoje no formato internacional: AAAA-MM-DD
        document.getElementById("fim").value = `${ano}-${mes}-${dia}`;
    });

    function validarDatas() {
        const inicio = document.getElementById("inicio").value;
        const fim = document.getElementById("fim").value;

        if (!inicio || !fim) {
            alert("Por favor, selecione ambas as datas para prosseguir.");
            return null;
        }
        return { inicio, fim };
    }

    function gerarPDF() {
        const datas = validarDatas();
        if (!datas) return;

        window.open(`/relatorio/intervalo/pdf?inicio=${datas.inicio}&fim=${datas.fim}`, "_blank");
    }

    function gerarExcel() {
        const datas = validarDatas();
        if (!datas) return;

        window.open(`/relatorio/intervalo/excel?inicio=${datas.inicio}&fim=${datas.fim}`, "_blank");
    }
</script>

</body>
</html>
