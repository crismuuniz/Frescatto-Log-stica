<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Movimentação de Fretes - Frescatto</title>
    <style>
        :root { --primary: #c00000; --success: #2ed573; --dark: #2f3542; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f1f2f6; color: var(--dark); padding: 20px; margin: 0; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        /* Destaque para o cálculo */
        .preview-box { background: #f8f9fa; padding: 15px; border-radius: 5px; margin-bottom: 20px; text-align: center; border: 2px dashed var(--success); }
        .preview-value { font-size: 1.5rem; font-weight: bold; color: var(--primary); }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ced6e0; border-radius: 5px; font-size: 14px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: var(--dark); color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #e4e7eb; }
        tr:hover { background-color: #fcfcfc; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚚 Lançamento de Fretes</h1>

    <div class="preview-box">
        <div>Valor Estimado do Frete</div>
        <div id="valor-preview" class="preview-value">R$ 0,00</div>
    </div>

    <form id="form">
        <div class="form-grid">
            <div class="form-group">
                <label>VEÍCULO</label>
                <select id="veiculo" required>
                    <option value="">Selecione...</option>
                    <option value="fiorino" data-taxa="2.20">Fiorino (R$ 2,20/KM)</option>
                    <option value="vlc" data-taxa="2.80">VLC (R$ 2,80/KM)</option>
                    <option value="hr" data-taxa="2.80">HR (R$ 2,80/KM)</option>
                    <option value="3/4" data-taxa="3.40">3/4 (R$ 3,40/KM)</option>
                    <option value="toco" data-taxa="4.10">Toco (R$ 4,10/KM)</option>
                    <option value="truck" data-taxa="5.00">Truck (R$ 5,00/KM)</option>
                    <option value="carreta" data-taxa="6.50">Carreta (R$ 6,50/KM)</option>
                </select>
            </div>
            <div class="form-group"><label>KM RODADOS</label><input type="number" id="km" step="0.1" placeholder="0.0" required></div>
            <div class="form-group"><label>PEDÁGIO (R$)</label><input type="number" id="pedagio" step="0.01" value="0.00"></div>
            <div class="form-group"><label>DIÁRIA (R$)</label><input type="number" id="diaria" step="0.01" value="0.00"></div>
            <div class="form-group"><label>ROTA</label><input id="rota" required></div>
            <div class="form-group"><label>DATA</label><input type="date" id="data" required></div>
        </div>
        <button type="submit">Salvar e Registrar Frete</button>
    </form>

    <div class="table-responsive">
        <table>
            <thead>
                <tr><th>Data</th><th>Rota</th><th>Veículo</th><th>KM</th><th class="text-right">Total</th></tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </div>
</div>

<script>
    const form = document.getElementById("form");
    const preview = document.getElementById("valor-preview");
    
    // Função de cálculo em tempo real
    function calcularPreview() {
        const taxa = parseFloat(document.getElementById("veiculo").selectedOptions[0]?.dataset.taxa || 0);
        const km = parseFloat(document.getElementById("km").value) || 0;
        const pedagio = parseFloat(document.getElementById("pedagio").value) || 0;
        const diaria = parseFloat(document.getElementById("diaria").value) || 0;
        
        const total = (km * taxa) + pedagio + diaria;
        preview.innerText = `R$ ${total.toFixed(2)}`;
    }

    // Adiciona evento de escuta para inputs
    ["veiculo", "km", "pedagio", "diaria"].forEach(id => {
        document.getElementById(id).addEventListener("input", calcularPreview);
    });

    // ... (restante da sua lógica de fetch/POST permanece igual)
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        // ... sua lógica de envio
        alert("Frete registrado com sucesso!");
        form.reset();
        calcularPreview();
        carregar();
    });
</script>
</body>
</html>
