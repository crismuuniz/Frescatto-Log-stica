<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Roteiros - Frescatto</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f1f2f6; color: #2f3542; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #c00000; margin-top: 0; border-bottom: 2px solid #c00000; padding-bottom: 10px; }
        h2 { margin-top: 30px; color: #2f3542; font-size: 1.2rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #57606f; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ced6e0; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        .btn-container { display: flex; gap: 10px; margin-top: 10px; }
        button { padding: 12px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; border: none; }
        .btn-salvar { background: #2ed573; color: white; flex: 2; }
        .btn-cancelar { background: #747d8c; color: white; flex: 1; display: none; }
        ul { padding: 0; }
        li { list-style: none; border: 1px solid #e4e7eb; padding: 20px; margin-bottom: 15px; border-radius: 8px; background: #fff; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛣️ Cadastro de Roteiros</h1>
    <form id="form">
        <div class="form-grid">
            <div class="form-group"><label>MOTORISTA</label><input id="motorista" required></div>
            <div class="form-group"><label>VEÍCULO</label><select id="veiculo" required><option value="">Selecione...</option><option value="fiorino">Fiorino</option><option value="vlc">VLC</option><option value="hr">HR</option><option value="toco">Toco</option></select></div>
            <div class="form-group"><label>CÓDIGO ROTEIRO</label><input id="codigo_roteiro" required></div>
            <div class="form-group"><label>DATA</label><input type="date" id="data_saida" required></div>
            
            <div class="form-group"><label>CARGA</label><input id="carga" placeholder="Ex: Carga Congelada"></div>
            <div class="form-group"><label>DESCRIÇÃO DA ROTA</label><input id="descricao_rota" placeholder="Ex: Rota Centro"></div>
            <div class="form-group"><label>QTD ENTREGAS</label><input type="number" id="quantidade_entregas"></div>
            <div class="form-group"><label>PESO (KG)</label><input type="number" id="peso" step="0.01"></div>
            <div class="form-group"><label>VOLUME</label><input type="number" id="volume" step="0.01"></div>
            <div class="form-group"><label>KM RODADOS</label><input type="number" id="km" step="0.1" required></div>
            <div class="form-group"><label>PEDÁGIO (R$)</label><input type="number" id="pedagio" step="0.01" value="0.00"></div>
            <div class="form-group"><label>DIÁRIA (R$)</label><input type="number" id="diaria" step="0.01" value="0.00"></div>
        </div>

        <div class="btn-container">
            <button type="submit" id="btn-submit" class="btn-salvar">Salvar Roteiro</button>
            <button type="button" id="btn-cancelar" class="btn-cancelar" onclick="limparEdicao()">Cancelar</button>
        </div>
    </form>

    <ul id="lista"></ul>
</div>

<script>
    const API = "/api/roteiros"; 
    const form = document.getElementById("form");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
            motorista: document.getElementById("motorista").value,
            veiculo: document.getElementById("veiculo").value,
            codigo_roteiro: document.getElementById("codigo_roteiro").value,
            data_carga: document.getElementById("data_saida").value,
            // Novos dados
            carga: document.getElementById("carga").value,
            descricao_rota: document.getElementById("descricao_rota").value,
            quantidade_entregas: document.getElementById("quantidade_entregas").value,
            peso: document.getElementById("peso").value,
            volume: document.getElementById("volume").value,
            // Valores financeiros
            km: parseFloat(document.getElementById("km").value) || 0,
            pedagio: parseFloat(document.getElementById("pedagio").value) || 0,
            diaria: parseFloat(document.getElementById("diaria").value) || 0
        };

        await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        form.reset();
        alert("Roteiro salvo!");
    });
</script>
</body>
</html>
