<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Logístico</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>

    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ font-family:Arial, Helvetica, sans-serif; background:#f4f6f9; color:#333; }
        .header{ background:#c00000; color:white; padding:25px; text-align:center; box-shadow:0 2px 10px rgba(0,0,0,.15); }
        .container{ max-width:1200px; margin:30px auto; padding:0 20px; }
        .card{ background:white; border-radius:12px; padding:25px; margin-bottom:25px; box-shadow:0 4px 12px rgba(0,0,0,.08); }
        .menu-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:15px; }
        .menu-item{ text-decoration:none; color:#333; background:#f8f9fa; border:1px solid #ddd; border-radius:10px; padding:20px; text-align:center; font-weight:bold; transition:.3s; }
        .menu-item:hover{ background:#c00000; color:white; }
        .form-group{ margin-bottom:15px; }
        .btn-group{ display:flex; gap:15px; margin-top:20px; }
        button{ border:none; border-radius:6px; padding:12px 20px; cursor:pointer; color:white; font-weight:bold; }
        .btn-ocr{ background:#c00000; margin-top:15px; }
        #resultadoOCR{ margin-top:15px; padding:15px; background:#f8f9fa; border-radius:6px; display:none; white-space:pre-wrap; border:1px solid #ddd; }
    </style>
</head>
<body>

<div class="header">
    <h1>🚚 Sistema Logístico</h1>
</div>

<div class="container">
    <div class="card">
        <h2>📦 Módulos</h2>
        <div class="menu-grid">
            <a href="/rotas" class="menu-item">🚚 Roteiros</a>
            <a href="/fretes" class="menu-item">💰 Fretes</a>
            <a href="/relatorios" class="menu-item">📊 Relatórios</a>
            <a href="/canhotos" class="menu-item">📝 Canhotos</a>
            <a href="/devolucoes" class="menu-item">↩️ Devoluções</a>
        </div>
    </div>

    <div class="card">
        <h2>📊 Exportar Relatórios</h2>
        <div class="form-group">
            <label>Data Inicial</label>
            <input type="date" id="inicio">
        </div>
        <div class="form-group">
            <label>Data Final</label>
            <input type="date" id="fim">
        </div>
        <div class="btn-group">
            <button class="btn-ocr" style="background:#e74c3c" onclick="gerarPDF()">📄 PDF</button>
            <button class="btn-ocr" style="background:#27ae60" onclick="gerarExcel()">📊 Excel</button>
        </div>
    </div>

    <div class="card">
        <h2>📷 Leitura Inteligente de Canhotos (OCR)</h2>
        <input type="file" id="fileInput" accept="image/*">
        <button class="btn-ocr" onclick="processarOCR()">Ler Documento</button>
        <div id="resultadoOCR"></div>
    </div>
</div>

<script>
    // Lógica OCR
    async function processarOCR() {
        const fileInput = document.getElementById("fileInput");
        const divResultado = document.getElementById("resultadoOCR");
        if (fileInput.files.length === 0) return alert("Selecione uma imagem.");
        
        divResultado.style.display = "block";
        divResultado.innerText = "🔍 Lendo documento...";
        
        const { data: { text } } = await Tesseract.recognize(fileInput.files[0], 'por');
        divResultado.innerText = "Texto Lido:\n\n" + text;
        
        await fetch("/api/salvar-dados", {
            method: "POST",
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ texto_ocr: text })
        });
    }

    // Datas iniciais
    window.addEventListener("DOMContentLoaded", () => {
        const hoje = new Date();
        document.getElementById("inicio").value = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().split('T')[0];
        document.getElementById("fim").value = hoje.toISOString().split('T')[0];
    });

    function gerarPDF() { window.open(`/relatorio/intervalo/pdf?inicio=${document.getElementById("inicio").value}&fim=${document.getElementById("fim").value}`, "_blank"); }
    function gerarExcel() { window.open(`/relatorio/intervalo/excel?inicio=${document.getElementById("inicio").value}&fim=${document.getElementById("fim").value}`, "_blank"); }
</script>

</body>
</html>
